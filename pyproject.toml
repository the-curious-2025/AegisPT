[project]
name = "aegispt"
version = "0.1.2"
description = "AegisPT deterministic penetration testing workflow orchestrator for Kali Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0",
	"ruff>=0.6.0"
]

[project.scripts]
aegispt = "pentest_orchestrator.cli:main"
kali-autopentest = "pentest_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pentest_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
